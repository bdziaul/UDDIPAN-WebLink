<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design By ZiauL</title>
    <link rel="icon" type="image/png" href="picture/world.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #000; overflow: hidden; font-family: 'Poppins', sans-serif; user-select: none; }
        .container { position: absolute; top: 10%; height: 90%; display: flex; justify-content: center; align-items: center; }
        .circle { position: absolute; background: transparent; width: calc(var(--i) * 2.5vmin); aspect-ratio: 1; border-radius: 50%; border: 3px solid rgb(0, 255, 13); transform-style: preserve-3d; transform: rotateX(70deg) translateZ(50px); animation: animate 3s ease-in-out calc(var(--i) * 0.08s) infinite; box-shadow: 0 0 15px rgb(124,124,124), inset 0 0 15px rgb(124,124,124); }
        @keyframes animate { 0%,100% { transform: rotateX(70deg) translateZ(50px) translateY(0); filter: hue-rotate(0); } 50% { transform: rotateX(70deg) translateZ(50px) translateY(-50vmin); filter: hue-rotate(360deg); } }
        .moving-text { position: fixed; top: 25px; width: 100%; font-size: 80px; font-family: "Times New Roman", serif; font-weight: 700; text-align: center; background: linear-gradient(90deg, #00ff9d, #00d0ff, #c400ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 12px rgba(0,255,120,0.7), 0 0 25px rgba(0,255,120,0.5), 0 0 40px rgba(0,255,120,0.3); animation: moveLeftRight 2.5s ease-in-out infinite alternate; pointer-events: none; }
        @keyframes moveLeftRight { 20% { transform: translateX(-150px); } 100% { transform: translateX(150px); } }
        .signature-box { position: fixed; padding: 15px 30px; border-radius: 25px; backdrop-filter: blur(15px); background: rgba(255,255,255,0.08); border: 1px solid rgba(0,255,150,0.3); box-shadow: 0 0 35px rgba(0,255,150,0.5), 0 0 60px rgba(0,255,150,0.3), inset 0 0 20px rgba(0,255,150,0.2); text-align: center; transition: 0.3s ease-in-out; z-index: 1000; }
        .signature-box h2 { margin: 0; font-size: 36px; font-weight: 700; font-family: "Times New Roman", serif; font-style: italic; background: linear-gradient(90deg, #00ffe7, #00c6ff, #ff00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 12px rgba(0,255,200,0.6), 0 0 25px rgba(0,255,200,0.5), 0 0 40px rgba(0,255,200,0.4); transition: 0.3s ease-in-out; }
        .signature-box:hover { transform: scale(1.05); box-shadow: 0 0 60px rgba(0,255,150,0.8), 0 0 100px rgba(0,255,150,0.6), inset 0 0 40px rgba(0,255,150,0.3); }
        .signature-box h2:hover { transform: scale(1.1); }
        .signature-bottom { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); padding: 25px 50px; border-radius: 40px; backdrop-filter: blur(15px); background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); box-shadow: 0 0 40px rgba(0,255,120,0.4), 0 0 15px rgba(0,255,120,0.25); text-align: center; transition: all 0.3s ease; z-index: 1000; }
        .signature-bottom h2 { margin: 0; font-size: 50px; font-family: "Times New Roman", serif; font-weight: 700; font-style: italic; text-decoration: underline; letter-spacing: 1px; background: linear-gradient(90deg, #00ff9d, #00d0ff, #c400ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 5px rgba(0,255,120,0.35), 0 0 10px rgba(0,255,120,0.25); transition: transform 0.3s ease, text-shadow 0.3s ease; }
        .signature-bottom h2:hover { transform: scale(1.1); text-shadow: 0 0 15px rgba(0,255,120,0.6), 0 0 25px rgba(0,255,120,0.5); cursor: pointer; }
        @media(max-width:800px){ .moving-text { font-size: 12vw; top: 15px; } .circle { width: calc(var(--i) * 3vmin); border-width: 2px; } .signature-box h2, .signature-bottom h2 { font-size: 4vw; } .signature-box { padding: 2px 6px; border-radius: 6px; } .signature-bottom h2 { font-size: 6vw; } }
    </style>
</head>
<body>
    <div class="moving-text">MFP & MF-CIB</div>
    <div class="container">
        <div class="circle" style="--i:0;"></div><div class="circle" style="--i:1;"></div><div class="circle" style="--i:2;"></div>
        <div class="circle" style="--i:3;"></div><div class="circle" style="--i:4;"></div><div class="circle" style="--i:5;"></div>
        <div class="circle" style="--i:6;"></div><div class="circle" style="--i:7;"></div><div class="circle" style="--i:8;"></div>
        <div class="circle" style="--i:9;"></div><div class="circle" style="--i:10;"></div><div class="circle" style="--i:11;"></div>
        <div class="circle" style="--i:12;"></div><div class="circle" style="--i:13;"></div><div class="circle" style="--i:14;"></div>
        <div class="circle" style="--i:15;"></div><div class="circle" style="--i:16;"></div><div class="circle" style="--i:17;"></div>
        <div class="circle" style="--i:18;"></div><div class="circle" style="--i:19;"></div><div class="circle" style="--i:20;"></div>
        <div class="circle" style="--i:21;"></div><div class="circle" style="--i:22;"></div><div class="circle" style="--i:23;"></div>
    </div>
    <div class="signature-box" style="top: 110px; left: 25px;"><a href="https://fb.com/ziaulz" target="_blank"><h2>Md. ZiauL Islam</h2></a></div>
    <div class="signature-box" style="top: 450px; left: 25px;"><a href="https://fb.com/nahidur.rahman.14224" target="_blank"><h2>Nahidur Rahman</h2></a></div>
    <div class="signature-box" style="top: 110px; right: 25px;"><a href="https://fb.com/kamrul.hasan.hiron.2025" target="_blank"><h2>Kamrul Hasan</h2></a></div>
    <div class="signature-box" style="top: 450px; right: 25px;"><a href="https://fb.com/mizan.ali.1426" target="_blank"><h2>Md.Mizan Ali</h2></a></div>
    <div class="signature-bottom"><a href="https://fb.com/mamun.rashid.79230305" target="_blank"><h2>Mamunur Rashid</h2></a></div>
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('cut', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if(e.key === "F12" || (e.ctrlKey && e.key === "u") || (e.ctrlKey && e.shiftKey && e.key === "I") || (e.ctrlKey && e.key === "c")) e.preventDefault();
        });
    </script>
</body>
</html>

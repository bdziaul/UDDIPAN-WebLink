<!-- loading.html - Smooth 0% to 100% Loading Screen -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-container">
        <div class="logo-wrapper">
            <div class="logo-background">
                <img src="picture/logo.png" alt="UDDIPAN" class="loading-logo">
            </div>
        </div>
        <div class="loading-percentage" id="loadingPercentage">0%</div>
        <div class="loading-text" id="loadingText">UDDIPAN Weblink</div>
        <div class="loading-message" id="loadingMessage">স্টার্ট হচ্ছে...</div>
        <div class="loading-progress-container">
            <div class="loading-progress-bar" id="progressBar" style="width: 0%"></div>
        </div>
        <div class="loading-dots">
            <span></span><span></span><span></span>
        </div>
    </div>
</div>
